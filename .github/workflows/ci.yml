name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bubblewrap and libseccomp
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests in a delegated cgroup
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --scope \
            --property=Delegate=yes --same-dir -- \
            bash -c 'sudo chown -R "$(id -u):$(id -g)" "/sys/fs/cgroup$(cut -d: -f3- </proc/self/cgroup)" && npm test'
