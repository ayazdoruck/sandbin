name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install bubblewrap, libseccomp, gcc and go
        run: |
          sudo apt-get update || true
          sudo apt-get install -y bubblewrap libseccomp-dev gcc golang-go

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: TEMP DEBUG - go env and a raw sandboxed go run
        run: |
          which go
          go env GOROOT
          echo "--- as runner user, before any sudo node runs ---"
          id
          mkdir -p data/go-cache
          ls -la data/
          stat data/go-cache
          echo "--- as root, does mkdirSync-then-bwrap-bind reproduce raw? ---"
          sudo bash -c '
            id
            mkdir -p /tmp/sandbin-debug-cache
            stat /tmp/sandbin-debug-cache
            echo "binding a fresh /tmp dir:"
            bwrap --ro-bind /tmp/sandbin-debug-cache /tmp/sandbin-debug-cache --bind /tmp /tmp2 -- true; echo "exit=$?"
            echo "binding the repo data/go-cache dir:"
            stat "'"$PWD"'/data/go-cache"
            bwrap --ro-bind "'"$PWD"'/data/go-cache" "'"$PWD"'/data/go-cache" -- true; echo "exit=$?"
          '
          echo "--- full sandbin run with SANDBIN_DEBUG ---"
          sudo env "PATH=$PATH" SANDBIN_DEBUG=1 node -e "
            import('./src/sandbox.mjs').then(async ({ run }) => {
              const r = await run({ language: 'go', code: 'package main\nimport \"fmt\"\nfunc main(){fmt.Println(\"hi\")}' });
              console.log(JSON.stringify(r, null, 2));
            });
          "

      - name: Run tests
        run: sudo env "PATH=$PATH" npm test
