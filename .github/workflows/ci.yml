name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bubblewrap and libseccomp
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Diagnose cgroup v2 delegation
        run: |
          U=$(id -u)
          ROOT=/sys/fs/cgroup/user.slice/user-$U.slice/user@$U.service
          echo "own cgroup: $(cat /proc/self/cgroup)"
          echo "root exists: $(test -d "$ROOT" && echo yes || echo no)"
          ls -ld "$ROOT" || true
          echo "root controllers: $(cat "$ROOT/cgroup.controllers" 2>&1)"
          echo "root subtree_control: $(cat "$ROOT/cgroup.subtree_control" 2>&1)"
          mkdir -p "$ROOT/diag.slice"
          ls -ld "$ROOT/diag.slice"
          echo '+cpu +memory +pids' > "$ROOT/diag.slice/cgroup.subtree_control" 2>&1 || echo "enable failed: $?"
          mkdir -p "$ROOT/diag.slice/run-test"
          echo $$ > "$ROOT/diag.slice/run-test/cgroup.procs" 2>&1 || echo "self-migrate failed: $?"
          cat /proc/self/cgroup

      - run: npm test
